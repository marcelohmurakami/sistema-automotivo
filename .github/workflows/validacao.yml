name: Validação do código
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacao-local
          path: output/validacao-refatoracao-atual/
